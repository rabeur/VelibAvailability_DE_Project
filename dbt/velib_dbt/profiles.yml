velib_dbt:
  target: prod
  outputs:

    prod:
      type: postgres
      host:     "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port:     "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user:     "{{ env_var('POSTGRES_USER', 'velib') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'velib') }}"
      dbname:   "{{ env_var('POSTGRES_DB', 'velib_dw') }}"
      schema: gold
      threads: 4

    dev:
      type: postgres
      host: localhost
      port: 5432
      user: velib
      password: velib
      dbname: velib_dw
      schema: gold_dev
      threads: 2

    # Cloud target — selected when PIPELINE_TARGET=cloud. Keyfile auth is used
    # over gcloud ADC so the same profile works inside the dbt container and
    # in CI. `priority: interactive` keeps latency low without changing cost
    # (BigQuery bills by bytes scanned, not job priority).
    bigquery_cloud:
      type: bigquery
      method: service-account
      keyfile:  "{{ env_var('GCP_SERVICE_ACCOUNT_KEY') }}"
      project:  "{{ env_var('GCP_PROJECT_ID') }}"
      dataset:  "{{ env_var('GCP_BIGQUERY_GOLD_DATASET', 'velib_gold') }}"
      location: "{{ env_var('GCP_REGION', 'europe-west1') }}"
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 600
      job_retries: 1
