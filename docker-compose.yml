services:

  postgres:
    image: postgres:17
    container_name: velib_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velib -d velib_dw"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - velib_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: velib_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - velib_network

  spark:
    image: apache/spark:3.5.0
    container_name: velib_spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ./data_lake:/opt/data_lake
      - ./spark_jobs:/opt/spark_jobs
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - velib_network

  dbt:
    build:
      context: ./dbt
    image: velib/dbt:1.9-dual
    container_name: velib_dbt
    entrypoint: ["tail", "-f", "/dev/null"]   # keep container alive for exec_run
    volumes:
      - ./dbt/velib_dbt:/usr/app/dbt
      # Bind-mount the GCP service-account keyfile at a fixed in-container
      # path when PIPELINE_TARGET=cloud. Falls back to /dev/null in local
      # mode so compose never fails on a missing host path; the `prod`
      # Postgres target does not read it.
      - ${GCP_SERVICE_ACCOUNT_KEY:-/dev/null}:/etc/gcp/service_account.json:ro
    working_dir: /usr/app/dbt
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # GCP vars surfaced to dbt's env_var() calls in profiles.yml. Empty in
      # local mode (the Postgres target ignores them); populated from
      # .env.cloud when PIPELINE_TARGET=cloud.
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - GCP_REGION=${GCP_REGION:-europe-west1}
      - GCP_BIGQUERY_GOLD_DATASET=${GCP_BIGQUERY_GOLD_DATASET:-velib_gold}
      - GCP_SERVICE_ACCOUNT_KEY=/etc/gcp/service_account.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - velib_network

  airflow-init:
    image: apache/airflow:2.9.0
    container_name: velib_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username ${AIRFLOW_ADMIN_USERNAME} \
          --password ${AIRFLOW_ADMIN_PASSWORD} \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    networks:
      - velib_network
    restart: on-failure

  airflow-scheduler:
    image: apache/airflow:2.9.0
    container_name: velib_airflow_scheduler
    user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
    group_add:
      - "${DOCKER_GID}"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - _PIP_ADDITIONAL_REQUIREMENTS=docker
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./data_lake:/opt/airflow/data_lake
    - ./spark_jobs:/opt/airflow/spark_jobs
    - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler
    networks:
      - velib_network

  airflow-webserver:
    image: apache/airflow:2.9.0
    container_name: velib_airflow_web
    user: "${AIRFLOW_UID}:${AIRFLOW_GID}"
    group_add:
      - "${DOCKER_GID}"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-scheduler:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW_FERNET_KEY}
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - _PIP_ADDITIONAL_REQUIREMENTS=docker
    volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./data_lake:/opt/airflow/data_lake
    - ./spark_jobs:/opt/airflow/spark_jobs
    - /var/run/docker.sock:/var/run/docker.sock
    ports:
    - "8081:8080"
    command: webserver
    networks:
      - velib_network

  superset-init:
    build:
      context: .
      dockerfile: superset/Dockerfile.superset
    image: velib_superset_custom:latest
    container_name: velib_superset_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
      - SUPERSET_CONFIG_PATH=/app/superset_config.py
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - SUPERSET_ADMIN_PASSWORD=${SUPERSET_ADMIN_PASSWORD}
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - ./superset/init.sh:/app/init.sh:ro
    command: ["/bin/bash", "/app/init.sh"]
    networks:
      - velib_network
    restart: on-failure

  superset:
    build:
      context: .
      dockerfile: superset/Dockerfile.superset
    image: velib_superset_custom:latest
    container_name: velib_superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
      - SUPERSET_CONFIG_PATH=/app/superset_config.py
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - superset_home:/app/superset_home
      - ./superset/superset_config.py:/app/superset_config.py:ro
    ports:
      - "8088:8088"
    networks:
      - velib_network


volumes:
  pg_data:
  pgadmin_data:
  superset_home:


networks:
  velib_network:
    driver: bridge